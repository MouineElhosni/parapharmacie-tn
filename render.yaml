services:
  - type: web
    name: parapharmacie-tn
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # --- PostgreSQL (managed: Render Postgres / Neon / Supabase) ---
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: STORE_WHATSAPP
        sync: false
      - key: CALLMEBOT_APIKEY
        sync: false
      - key: JWT_SECRET
        sync: false
